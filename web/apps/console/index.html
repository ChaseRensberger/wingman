<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%icon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#18181b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Wingman</title>
    <script>
      try {
        const theme = localStorage.getItem("wingman-theme") || "default";
        const mode = localStorage.getItem("wingman-theme-mode") || "system";
        const resolvedMode =
          mode === "system"
            ? matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : mode;
        if (
          ["default", "gruvbox", "dracula"].includes(theme) &&
          ["light", "dark"].includes(resolvedMode)
        ) {
          document.documentElement.dataset.theme = theme;
          document.documentElement.dataset.mode = theme === "dracula" ? "dark" : resolvedMode;
          document.documentElement.classList.add(theme === "dracula" ? "dark" : resolvedMode);
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
