name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up bun
        uses: oven-sh/setup-bun@v2

      - name: Set up node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Set up deno
        uses: denoland/setup-deno@v2

      - name: Install JavaScript dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Check web formatting
        working-directory: web
        run: bun run format:check

      - name: Lint web workspaces
        working-directory: web
        run: bun run lint

      - name: Build TypeScript workspaces
        working-directory: web
        run: bun run build

      - name: Check API contract drift
        run: ./scripts/check-api-contract.sh

      - name: Check browser client boundaries
        working-directory: web
        run: bun run --filter @wingman-actor/client test

      - name: Test Console
        working-directory: web
        run: bun run --filter @wingman/console test

      - name: Test Desktop
        working-directory: web
        run: bun run --filter @wingman/desktop test

      - name: Test npm package artifact
        run: bash scripts/test-client-package.sh

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -tags webdist ./...

      - name: Test
        run: go test ./...

      - name: Test installer
        run: ./scripts/test-install.sh

  macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

  release-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up bun
        uses: oven-sh/setup-bun@v2

      - name: Install JavaScript dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Build Console assets
        working-directory: web
        run: bun run build:console

      - name: Build snapshot artifacts
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --snapshot --clean

      - name: Smoke test Linux artifact
        run: ./scripts/smoke-release-artifact.sh "$(find dist -type f -name 'wingman_*_linux_amd64.tar.gz' -print -quit)"
