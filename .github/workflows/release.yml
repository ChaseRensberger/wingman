name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up bun
        uses: oven-sh/setup-bun@v2

      - name: Set up node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install JavaScript dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Verify client release version
        run: bash scripts/check-client-version.sh "${GITHUB_REF_NAME#v}"

      - name: Build npm package
        working-directory: web
        run: bun run build:client

      - name: Build Console assets
        working-directory: web
        run: bun run build:console

      - name: Publish release artifacts
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify published installer
        run: |
          WINGMAN_INSTALL_DIR="$RUNNER_TEMP/wingman/bin" ./install --version "$GITHUB_REF_NAME" --no-modify-path --yes
          "$RUNNER_TEMP/wingman/bin/wingman" version

      - name: Publish npm package
        working-directory: web/packages/client
        run: npm publish --provenance
