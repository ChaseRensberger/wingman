name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up bun
        uses: oven-sh/setup-bun@v2

      - name: Set up node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Set up deno
        uses: denoland/setup-deno@v2

      - name: Install JavaScript dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Build TypeScript workspaces
        working-directory: web
        run: bun run build

      - name: Check API contract drift
        run: ./scripts/check-api-contract.sh

      - name: Check browser client boundaries
        working-directory: web
        run: bun run --filter @wingman-actor/client test

      - name: Verify client release version
        run: bash scripts/check-client-version.sh "${GITHUB_REF_NAME#v}"

      - name: Test npm package artifact
        run: bash scripts/test-client-package.sh

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -tags webdist ./...

      - name: Test
        run: go test ./...

      - name: Build snapshot artifacts
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --snapshot --clean

      - name: Smoke test Linux artifact
        run: ./scripts/smoke-release-artifact.sh "$(find dist -type f -name 'wingman_*_linux_amd64.tar.gz' -print -quit)"

      - name: Publish release artifacts
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify published installer
        run: |
          WINGMAN_INSTALL_DIR="$RUNNER_TEMP/wingman/bin" ./install --version "$GITHUB_REF_NAME" --no-modify-path --yes
          "$RUNNER_TEMP/wingman/bin/wingman" version

      - name: Publish npm package
        working-directory: web/packages/client
        run: npm publish --provenance

      - name: Verify published npm package
        run: test "$(npm view @wingman-actor/client version)" = "${GITHUB_REF_NAME#v}"
