name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Set up bun
        uses: oven-sh/setup-bun@v2

      - name: Set up node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install JavaScript dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Build npm package
        working-directory: web
        run: bun run build:client

      - name: Pack and test versioned npm package
        run: |
          tarball=$(bash scripts/pack-client-release.sh "${GITHUB_REF_NAME#v}" "$RUNNER_TEMP/npm-release")
          bash scripts/test-client-package.sh "$tarball"

      - name: Build Console assets
        working-directory: web
        run: bun run build:console

      - name: Publish release artifacts
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify published installer
        run: |
          WINGMAN_INSTALL_DIR="$RUNNER_TEMP/wingman/bin" ./install --version "$GITHUB_REF_NAME" --no-modify-path --yes
          "$RUNNER_TEMP/wingman/bin/wingman" version

      - name: Publish npm package
        working-directory: web/packages/client
        run: npm publish "$RUNNER_TEMP/npm-release/wingman-actor-client-${GITHUB_REF_NAME#v}.tgz" --provenance

  container:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Download release binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$GITHUB_REF_NAME" --pattern 'wingman_*_linux_*.tar.gz' --dir "$RUNNER_TEMP/release-archives"
          for arch in amd64 arm64; do
            mkdir -p "$RUNNER_TEMP/container-binaries/$arch"
            tar -xzf "$RUNNER_TEMP/release-archives"/wingman_*_linux_"$arch".tar.gz -C "$RUNNER_TEMP/container-binaries/$arch" wingman
          done
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set container tags
        id: container-tags
        run: |
          tags="ghcr.io/chaserensberger/wingman:${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            tags="$tags,ghcr.io/chaserensberger/wingman:latest"
          fi
          printf 'tags=%s\n' "$tags" >> "$GITHUB_OUTPUT"
      - name: Publish container image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.container-tags.outputs.tags }}
          build-contexts: |
            build=${{ runner.temp }}/container-binaries
          cache-from: type=registry,ref=ghcr.io/chaserensberger/wingman:buildcache
          cache-to: type=registry,ref=ghcr.io/chaserensberger/wingman:buildcache,mode=max
